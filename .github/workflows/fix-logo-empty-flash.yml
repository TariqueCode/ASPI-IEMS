name: Prevent logo empty-source flash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch logo fallbacks
        shell: python
        run: |
          from pathlib import Path

          files = [Path('index.html'), Path('admin/index.html')]
          changed = False

          for path in files:
              s = path.read_text(encoding='utf-8')
              old = 'data.site.logo || \'\''
              new = "data.site.logo || 'logo.php'"
              if old in s:
                  s = s.replace(old, new)
                  changed = True

              # Splash/logo error fallback must never become an empty src.
              s2 = s.replace(
                  "$el.src = $el.src.includes('ASPI-Logo.png') ? '' : ''",
                  "$el.src = 'logo.php'"
              )
              if s2 != s:
                  s = s2
                  changed = True

              path.write_text(s, encoding='utf-8')

          if not changed:
              print('No logo fallback changes needed.')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Keep logo loaded until current logo data is available"
          git push
