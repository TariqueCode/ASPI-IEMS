name: Cleanup media and formalize theme toggle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-media-and-theme.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean default images and update theme toggle
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('.')

          # 1) Remove all image assets from the upload directory.
          upload = root / 'assets' / 'uploads'
          if upload.exists():
              for p in upload.iterdir():
                  if p.is_file() and p.suffix.lower() in {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.bmp', '.svg', '.avif'}:
                      p.unlink()

          # 2) Clear default image references from the public JSON database.
          db_path = root / 'data' / 'db.json'
          if db_path.exists():
              data = json.loads(db_path.read_text(encoding='utf-8'))

              def clean_images(obj):
                  if isinstance(obj, dict):
                      for k in list(obj.keys()):
                          v = obj[k]
                          if k in {'logo', 'image_url', 'principal_img', 'avatar_url', 'photo_url', 'profile_image'}:
                              if isinstance(v, str):
                                  obj[k] = ''
                          # Existing teacher/event/notice file_url values may be PDFs,
                          # so do not blanket-clear file_url here.
                          clean_images(v)
                  elif isinstance(obj, list):
                      for item in obj:
                          clean_images(item)

              clean_images(data)
              db_path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          # 3) Remove hard-coded uploaded-image fallbacks from index.html.
          idx = root / 'index.html'
          html = idx.read_text(encoding='utf-8')

          # Convert literal uploads image paths used as fallbacks to empty strings.
          html = re.sub(r"assets/uploads/[^'\"\\`<>]+\.(?:png|jpe?g|webp|gif|bmp|svg|avif)", "", html, flags=re.I)

          # 4) Add a polished formal theme toggle style and behavior.
          css = r'''
<style id="aspi-formal-theme-toggle">
/* Formal ASPI theme switch */
.aspi-formal-theme-toggle {
  position: relative !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: .55rem !important;
  min-width: 92px !important;
  height: 40px !important;
  padding: 4px 12px 4px 5px !important;
  border: 1px solid rgba(148,163,184,.35) !important;
  border-radius: 999px !important;
  background: rgba(248,250,252,.96) !important;
  color: #334155 !important;
  box-shadow: 0 4px 16px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.8) !important;
  backdrop-filter: blur(14px) !important;
  transition: all .22s ease !important;
  cursor: pointer !important;
}
.aspi-formal-theme-toggle:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(15,23,42,.12); }
.aspi-formal-theme-toggle .aspi-theme-knob {
  width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px;
  display:flex; align-items:center; justify-content:center;
  background:#ffffff; color:#475569;
  box-shadow:0 2px 8px rgba(15,23,42,.16);
  transition:transform .24s ease, background .24s ease, color .24s ease;
}
.aspi-formal-theme-toggle .aspi-theme-label { font-size:11px; font-weight:800; line-height:1; white-space:nowrap; }
.dark .aspi-formal-theme-toggle {
  background: rgba(15,23,42,.92) !important;
  color: #e2e8f0 !important;
  border-color: rgba(148,163,184,.22) !important;
  box-shadow: 0 4px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05) !important;
}
.dark .aspi-formal-theme-toggle .aspi-theme-knob {
  background:#1e293b; color:#facc15; transform:rotate(180deg);
}
</style>
'''

          if 'id="aspi-formal-theme-toggle"' not in html:
              html = html.replace('</head>', css + '\n</head>', 1)

          # Small runtime enhancer: find the existing Alpine theme button and
          # turn it into the formal compact switch without changing its click logic.
          script = r'''
<script>
(function(){
  function enhanceThemeToggle(){
    document.querySelectorAll('button').forEach(function(btn){
      var probe = (btn.getAttribute('@click') || btn.getAttribute('x-on:click') || '').replace(/\s/g,'');
      if (probe !== 'toggleTheme()') return;
      if (btn.classList.contains('aspi-formal-theme-toggle')) return;
      btn.classList.add('aspi-formal-theme-toggle');
      btn.innerHTML = '<span class="aspi-theme-knob"><i class="fa-solid fa-moon text-sm"></i></span><span class="aspi-theme-label">থিম</span>';
      btn.setAttribute('title','লাইট / ডার্ক মোড পরিবর্তন');
      btn.setAttribute('aria-label','লাইট / ডার্ক মোড পরিবর্তন');
    });
  }
  document.addEventListener('DOMContentLoaded', enhanceThemeToggle);
  setTimeout(enhanceThemeToggle, 800);
  setTimeout(enhanceThemeToggle, 1800);
})();
</script>
'''
          if 'enhanceThemeToggle' not in html:
              html = html.replace('</body>', script + '\n</body>', 1)

          # Hide broken image placeholders while still allowing dashboard-added
          # images to render normally.
          fallback_script = r'''
<script>
(function(){
  document.addEventListener('error', function(e){
    var img=e.target;
    if(img && img.tagName==='IMG' && img.src && img.src.indexOf('/assets/uploads/')!==-1){
      img.style.visibility='hidden';
    }
  }, true);
})();
</script>
'''
          if 'indexOf(\'/assets/uploads/\')' not in html:
              html = html.replace('</body>', fallback_script + '\n</body>', 1)

          idx.write_text(html, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/uploads data/db.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clear default media and formalize theme toggle"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/cleanup-media-and-theme.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time cleanup workflow" || true
          git push || true
