name: Optimize ASPI frontend

on:
  push:
    paths:
      - 'index.html'
      - 'assets/css/performance.css'
      - 'assets/js/performance.js'
      - '.github/workflows/optimize-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'chore: apply frontend performance patch [perf-bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch HTML for faster loading
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- ASPI PERFORMANCE PATCH -->'
          if marker not in html:
              head_patch = '''\n<!-- ASPI PERFORMANCE PATCH -->\n<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>\n<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>\n<link rel="stylesheet" href="assets/css/performance.css?v=1.0.0">\n'''
              html = html.replace('</head>', head_patch + '\n</head>', 1)

              # Font Awesome is non-critical; allow the browser to render the page first.
              html = html.replace(
                  '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">',
                  '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media=\'all\'">\n<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>'
              )

              body_patch = '''\n<script defer src="assets/js/performance.js?v=1.0.0"></script>\n'''
              html = html.replace('</body>', body_patch + '\n</body>', 1)
              path.write_text(html, encoding='utf-8')

      - name: Upgrade Apache compression and caching
        shell: python
        run: |
          from pathlib import Path
          p = Path('.htaccess')
          if not p.exists():
              raise SystemExit('Root .htaccess not found')
          txt = p.read_text(encoding='utf-8')
          marker = '# ASPI PERFORMANCE SERVER RULES'
          if marker not in txt:
              txt += r'''\n\n# ASPI PERFORMANCE SERVER RULES\n<IfModule mod_deflate.c>\n    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml\n    AddOutputFilterByType DEFLATE application/wasm application/x-font-ttf font/ttf font/opentype\n</IfModule>\n\n<IfModule mod_brotli.c>\n    BrotliCompressionQuality 5\n    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml\n</IfModule>\n\n<IfModule mod_headers.c>\n    <FilesMatch "\.(css|js|svg|woff2?|ttf)$">\n        Header set Cache-Control "public, max-age=2592000"\n    </FilesMatch>\n    <FilesMatch "\.(jpg|jpeg|png|webp|gif|avif)$">\n        Header set Cache-Control "public, max-age=2592000"\n    </FilesMatch>\n    <FilesMatch "\.html$">\n        Header set Cache-Control "no-cache, must-revalidate"\n    </FilesMatch>\n</IfModule>\n'''
              p.write_text(txt, encoding='utf-8')

      - name: Commit optimization patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .htaccess assets/css/performance.css assets/js/performance.js
          if git diff --cached --quiet; then
            echo "No optimization changes needed"
            exit 0
          fi
          git commit -m "chore: apply frontend performance patch [perf-bot]"
          git push
