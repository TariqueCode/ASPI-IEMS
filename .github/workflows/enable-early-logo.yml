name: Enable early logo loading

on:
  workflow_dispatch:
  push:
    paths:
      - 'logo.php'
      - 'assets/js/logo-early.js'
      - '.github/workflows/enable-early-logo.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch homepage for early logo loading
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          preload = '<link id="aspiLogoPreload" rel="preload" as="image" href="logo.php">'
          script = '<script src="assets/js/logo-early.js?v=1.0.0"></script>'

          if 'id="aspiLogoPreload"' not in html:
              html = html.replace('</head>', f'    {preload}\n</head>', 1)

          if 'assets/js/logo-early.js' not in html:
              html = html.replace('</head>', f'    {script}\n</head>', 1)

          # Give all current ASPI logo nodes an immediate real src. Alpine can
          # replace it later when data.site.logo arrives, but the browser starts
          # loading logo.php during the initial HTML parse.
          pattern = re.compile(r'<img\s+(:src="data\.site\.logo\s*\|\|\s*[\"\'][^\"\']+[\"\'])')
          html = pattern.sub(lambda m: '<img src="logo.php" ' + m.group(1), html)

          path.write_text(html, encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="aspiLogoPreload"',
              'assets/js/logo-early.js?v=1.0.0',
              '<img src="logo.php"',
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing expected logo bootstrap: ' + ', '.join(missing))

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Load site logo before frontend data"
          git push
