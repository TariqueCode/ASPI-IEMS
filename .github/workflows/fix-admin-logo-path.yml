name: Restore admin dashboard and fix favicon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good dashboard
        shell: bash
        run: |
          git checkout f3161ce447968a7544373feef4c39b0e2b207b40 -- admin/index.html

      - name: Add instant non-blocking favicon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')

          old = '<link id="adminFavicon" rel="icon" type="image/png" href="">'
          new = '''<link id="adminFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231e3a8a%27/%3E%3Ctext x=%2732%27 y=%2739%27 text-anchor=%27middle%27 font-family=%27Arial,sans-serif%27 font-size=%2724%27 font-weight=%27700%27 fill=%27white%27%3EA</text%3E%3C/svg%3E">'''

          if old not in s:
              raise SystemExit('Expected favicon markup was not found.')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit restored dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Restore admin dashboard and fix favicon"
          git push
