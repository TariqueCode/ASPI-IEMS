name: Fix dark dropdown

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch native select dark mode
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          marker = '<style id="aspi-native-select-dark">'
          if marker not in text:
              css = '''\n<style id="aspi-native-select-dark">\n/* Native form controls: keep the popup/dropdown dark when ASPI is in dark mode. */\n.dark select {\n    color-scheme: dark;\n}\n.dark select option,\n.dark select optgroup {\n    background-color: #0f172a !important;\n    color: #f8fafc !important;\n}\n.dark select option:checked,\n.dark select option:hover {\n    background-color: #1e3a8a !important;\n    color: #ffffff !important;\n}\n</style>\n'''
              head = text.lower().find('</head>')
              if head == -1:
                  raise SystemExit('Could not find </head> in index.html')
              text = text[:head] + css + text[head:]
              p.write_text(text, encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-dark-select.yml
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix native dark mode dropdowns"
          git push
