name: Make API JSON response resilient

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove hard dependency on upload cleanup helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # api.php must never fail just because the optional upload GC helper
          # is missing on an older/live deployment.
          p = Path('api.php')
          s = p.read_text(encoding='utf-8')
          old = "require_once __DIR__ . '/upload_gc.php';"
          new = "if (is_file(__DIR__ . '/upload_gc.php')) { require_once __DIR__ . '/upload_gc.php'; }"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('api.php dependency made optional')
          else:
              print('api.php optional dependency already fixed')

          # upload.php also needs to remain functional when the optional helper
          # is not present. Cleanup is skipped in that case.
          p = Path('upload.php')
          s = p.read_text(encoding='utf-8')
          old = "require_once __DIR__ . '/upload_gc.php';"
          new = "if (is_file(__DIR__ . '/upload_gc.php')) { require_once __DIR__ . '/upload_gc.php'; }"
          if old in s:
              s = s.replace(old, new, 1)

          old_call = "aspiCleanupUnreferencedUploads();"
          new_call = "if (function_exists('aspiCleanupUnreferencedUploads')) { aspiCleanupUnreferencedUploads(); }"
          if old_call in s:
              s = s.replace(old_call, new_call, 1)

          p.write_text(s, encoding='utf-8')
          print('upload.php made resilient')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.php upload.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Make API and uploads resilient to missing cleanup helper"
          git push
