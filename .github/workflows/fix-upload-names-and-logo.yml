name: Fix named uploads and instant logo loading

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch upload naming, cleanup, and early logo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------------
          # upload.php: honor desired_filename and replace same-purpose files.
          # ------------------------------------------------------------------
          p = Path('upload.php')
          s = p.read_text(encoding='utf-8')
          old = """        $uniqueName = time() . '_' . rand(1000, 9999) . '.' . $ext;
        $targetPath = $uploadDir . '/' . $uniqueName;
        $relativePath = 'assets/uploads/' . $uniqueName;

        if (move_uploaded_file($file['tmp_name'], $targetPath) || @copy($file['tmp_name'], $targetPath)) {"""
          new = """        $desired = trim((string)($_POST['desired_filename'] ?? ''));
        $baseName = $desired !== '' ? pathinfo($desired, PATHINFO_FILENAME) : '';
        $baseName = preg_replace('/[\\x00-\\x1F\\x7F\\\\\\/:*?\\\"<>|]+/u', ' ', $baseName);
        $baseName = trim(preg_replace('/\\s+/u', ' ', (string)$baseName), ' .');
        if ($baseName === '') {
            $baseName = pathinfo($file['name'], PATHINFO_FILENAME);
            $baseName = trim(preg_replace('/\\s+/u', ' ', $baseName), ' .');
        }
        if ($baseName === '') $baseName = 'ASPI-File';
        $uniqueName = $baseName . '.' . $ext;
        $targetPath = $uploadDir . '/' . $uniqueName;
        $relativePath = 'assets/uploads/' . $uniqueName;

        if (move_uploaded_file($file['tmp_name'], $targetPath) || @copy($file['tmp_name'], $targetPath)) {"""
          if old in s:
              s = s.replace(old, new, 1)

          old2 = """        $ext = $mimeMap[$mime] ?? 'png';
        $uniqueName = time() . '_' . rand(1000, 9999) . '.' . $ext;
        $targetPath = $uploadDir . '/' . $uniqueName;
        $relativePath = 'assets/uploads/' . $uniqueName;"""
          new2 = """        $ext = $mimeMap[$mime] ?? 'png';
        $desired = trim((string)($json['desired_filename'] ?? ''));
        $baseName = $desired !== '' ? pathinfo($desired, PATHINFO_FILENAME) : 'ASPI-File';
        $baseName = preg_replace('/[\\x00-\\x1F\\x7F\\\\\\/:*?\\\"<>|]+/u', ' ', $baseName);
        $baseName = trim(preg_replace('/\\s+/u', ' ', (string)$baseName), ' .');
        if ($baseName === '') $baseName = 'ASPI-File';
        $uniqueName = $baseName . '.' . $ext;
        $targetPath = $uploadDir . '/' . $uniqueName;
        $relativePath = 'assets/uploads/' . $uniqueName;"""
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # admin/index.html: deterministic human-readable upload names and
          # upload.php-first path so the naming contract is always used.
          # ------------------------------------------------------------------
          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')
          old_start = """                async uploadFile(event, objRef, propertyName) {"""
          start = s.find(old_start)
          if start == -1:
              raise SystemExit('uploadFile function not found')
          end_marker = """                getAdmissionQRCodeUrl(admission) {"""
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit('uploadFile end marker not found')

          replacement = r'''                getUploadFilename(objRef, propertyName, file) {
                    const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
                    const special = {
                        'আফনান ইসলাম': 'Afnan Islam - Chairman',
                        'নুরুল ইসলাম': 'Nurul Islam - President',
                        'মরহুম আলহাজ্ব সিরাজুল ইসলাম': 'Sirajul Islam - Founder',
                        'সিরাজুল ইসলাম': 'Sirajul Islam - Founder'
                    };

                    let base = 'ASPI-File';
                    if (objRef === this.data.site && propertyName === 'logo') {
                        base = 'ASPI-Logo';
                    } else if (objRef === this.data.site && propertyName === 'custom_font') {
                        base = 'ASPI-Custom-Font';
                    } else if (objRef === this.data.site?.founder && propertyName === 'image_url') {
                        base = 'Sirajul Islam - Founder';
                    } else if (objRef?.name && special[objRef.name]) {
                        base = special[objRef.name];
                    } else if (objRef?.name && (objRef?.designation || objRef?.deg)) {
                        base = `${objRef.name} - ${objRef.designation || objRef.deg}`;
                    } else if (objRef?.title) {
                        base = objRef.title;
                    } else if (objRef?.name) {
                        base = objRef.name;
                    }

                    // Keep readable Unicode names, but remove characters that can
                    // break a path or create nested directories.
                    base = String(base)
                        .replace(/[\\/:*?"<>|\u0000-\u001F]/g, ' ')
                        .replace(/\s+/g, ' ')
                        .trim()
                        .replace(/[. ]+$/g, '');
                    return `${base || 'ASPI-File'}.${ext}`;
                },

                async uploadFile(event, objRef, propertyName) {
                    const file = event.target.files[0];
                    if (!file) return;
                    this.isLoading = true;

                    const desiredFilename = this.getUploadFilename(objRef, propertyName, file);
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload', file);
                    formData.append('image', file);
                    formData.append('desired_filename', desiredFilename);

                    let uploadedUrl = null;
                    let lastErrorMessage = '';

                    // upload.php is the canonical named-upload endpoint.
                    try {
                        const res = await fetch('../upload.php', { method: 'POST', body: formData });
                        const result = await res.json();
                        if (result.url || result.file_url) {
                            uploadedUrl = result.url || result.file_url;
                        } else if (result.error) {
                            lastErrorMessage = result.error;
                        }
                    } catch (e1) {
                        lastErrorMessage = e1.message;
                    }

                    // API fallback for older deployments.
                    if (!uploadedUrl) {
                        try {
                            const res2 = await fetch('../api.php?action=upload', { method: 'POST', body: formData });
                            const result2 = await res2.json();
                            if (result2.url || result2.file_url) {
                                uploadedUrl = result2.url || result2.file_url;
                            } else if (result2.error) {
                                lastErrorMessage = result2.error;
                            }
                        } catch (e2) {
                            lastErrorMessage = e2.message;
                        }
                    }

                    if (uploadedUrl) {
                        objRef[propertyName] = uploadedUrl;
                        if (propertyName === 'logo') {
                            localStorage.setItem('aspi_logo_url', uploadedUrl);
                            this.updateFavicon(uploadedUrl);
                            document.querySelectorAll('img[alt="ASPI Logo"]').forEach(img => {
                                img.src = '../' + uploadedUrl + '?v=' + Date.now();
                            });
                        }
                        alert(`ফাইল সফলভাবে আপলোড হয়েছে: ${desiredFilename}\nএখন 'পরিবর্তন সেভ করুন' চাপুন।`);
                    } else {
                        const errMsg = lastErrorMessage || 'আপলোড ব্যর্থ হয়েছে। assets/uploads ফোল্ডারের permission চেক করুন।';
                        alert('আপলোড ব্যর্থ: ' + errMsg);
                    }
                    this.isLoading = false;
                },

'''
          s = s[:start] + replacement + s[end:]

          # ------------------------------------------------------------------
          # admin/index.html: preload the live logo before Alpine/API rendering.
          # ------------------------------------------------------------------
          preload = '    <link rel="preload" as="image" href="../logo.php" fetchpriority="high">\n'
          script = '    <script src="../assets/js/logo-early.js?v=3" fetchpriority="high"></script>\n'
          if 'href="../logo.php" fetchpriority="high"' not in s:
              marker = '    <title>ASPI এডমিন কন্ট্রোল প্যানেল</title>\n'
              s = s.replace(marker, marker + preload + script, 1)
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # index.html: same early logo strategy for public website.
          # ------------------------------------------------------------------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          preload = '    <link rel="preload" as="image" href="logo.php" fetchpriority="high">\n'
          script = '    <script src="assets/js/logo-early.js?v=3" fetchpriority="high"></script>\n'
          if 'href="logo.php" fetchpriority="high"' not in s:
              marker = '    <title>আসহাব সিরাজ পলিটেকনিক ইনস্টিটিউট - ASPI | একটাই লক্ষ্য, হতে হবে দক্ষ</title>\n'
              s = s.replace(marker, marker + preload + script, 1)
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # logo.php: avoid stale logo caching after dashboard replacement.
          # ------------------------------------------------------------------
          p = Path('logo.php')
          s = p.read_text(encoding='utf-8')
          s = s.replace("header('Cache-Control: public, max-age=300, must-revalidate');", "header('Cache-Control: no-cache, must-revalidate, max-age=0');")
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # api.php: run upload GC after data is successfully saved.
          # ------------------------------------------------------------------
          p = Path('api.php')
          s = p.read_text(encoding='utf-8')
          if "require_once __DIR__ . '/upload_gc.php';" not in s:
              s = s.replace("<?php\n", "<?php\nrequire_once __DIR__ . '/upload_gc.php';\n", 1)
          old = """function saveDatabase($data) {
    global $dbFile;
    return @file_put_contents($dbFile, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE));
}"""
          new = """function saveDatabase($data) {
    global $dbFile;
    $written = @file_put_contents($dbFile, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE));
    if ($written !== false && function_exists('aspiCleanupUnreferencedUploads')) {
        @aspiCleanupUnreferencedUploads($data);
    }
    return $written;
}"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html index.html upload.php api.php logo.php
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Use descriptive upload filenames and load logo immediately"
          git push
