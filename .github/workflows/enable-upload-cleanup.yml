name: Enable automatic upload cleanup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch upload handlers
        run: |
          python3 <<'PY'
          from pathlib import Path

          api = Path('api.php')
          text = api.read_text(encoding='utf-8')
          marker = 'ASPI_UPLOAD_GC_ENABLED_V1'
          if marker not in text:
              anchor = "$uploadDir = $baseDir . '/assets/uploads';"
              insert = anchor + "\n\n// ASPI_UPLOAD_GC_ENABLED_V1\nrequire_once __DIR__ . '/upload_gc.php';"
              if anchor not in text:
                  raise SystemExit('api.php upload directory anchor not found')
              text = text.replace(anchor, insert, 1)

              old = "        saveDatabase($db);\n        echo json_encode(['status' => 'success', 'message' => 'ওয়েবসাইটের তথ্য সংরক্ষিত হয়েছে।'], JSON_UNESCAPED_UNICODE);"
              new = "        saveDatabase($db);\n        aspiCleanupUnreferencedUploads($db);\n        echo json_encode(['status' => 'success', 'message' => 'ওয়েবসাইটের তথ্য সংরক্ষিত হয়েছে।'], JSON_UNESCAPED_UNICODE);"
              if old not in text:
                  raise SystemExit('api.php save-data anchor not found')
              text = text.replace(old, new, 1)
              api.write_text(text, encoding='utf-8')

          upload = Path('upload.php')
          text = upload.read_text(encoding='utf-8')
          marker2 = 'ASPI_UPLOAD_GC_ENABLED_V1'
          if marker2 not in text:
              anchor = "$uploadDir = __DIR__ . '/assets/uploads';"
              insert = anchor + "\nrequire_once __DIR__ . '/upload_gc.php';"
              if anchor not in text:
                  raise SystemExit('upload.php directory anchor not found')
              text = text.replace(anchor, insert, 1)

              old = "if ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    $file = $_FILES['file'] ?? $_FILES['image'] ?? $_FILES['upload'] ?? null;"
              new = "if ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    // Remove uploads no longer referenced by the saved site data before accepting a new upload.\n    aspiCleanupUnreferencedUploads();\n    $file = $_FILES['file'] ?? $_FILES['image'] ?? $_FILES['upload'] ?? null;"
              if old not in text:
                  raise SystemExit('upload.php POST anchor not found')
              text = text.replace(old, new, 1)
              upload.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git add api.php upload.php
          git commit -m "Clean up unreferenced uploaded files"
          git push origin main
