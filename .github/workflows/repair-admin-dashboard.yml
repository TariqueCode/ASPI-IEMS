name: Repair admin dashboard safely

on:
  workflow_dispatch:
  push:
    paths:
      - 'admin/index.html'
      - 'admin/theme-settings.js'
      - 'index.html'
      - 'founder.html'
      - '.github/workflows/repair-admin-dashboard.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair admin HTML loading and keep one theme toggle
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('admin/index.html')
          html = path.read_text(encoding='utf-8')

          # Remove any theme-settings script that may have been inserted inside
          # a JavaScript template string by the old mod_substitute approach.
          html = re.sub(
              r'<script\s+defer\s+src=["\']theme-settings\.js[^>]*></script>',
              '',
              html,
              flags=re.I,
          )

          # Remove duplicate theme controls from sidebar and profile modal.
          html = re.sub(
              r'(?s)\s*<!-- Theme Mode Toggle Row in Sidebar.*?</div>\s*\n\s*<div class="flex items-center justify-between text-\[11px\]',
              '\n                <div class="flex items-center justify-between text-[11px]',
              html,
              count=1,
          )

          html = re.sub(
              r'(?s)\s*<!-- Theme Toggle Button -->\s*<button[^>]*@click="toggleTheme\(\)"[^>]*>.*?</button>',
              '',
              html,
              count=1,
          )

          # Remove the visible default admin username/password and hosting guide
          # block from the login screen. Authentication logic remains unchanged.
          html = re.sub(
              r'(?s)\s*<!-- Default Credentials Note -->.*?(?=\s*<!-- Hosting & Database Connection Guide Modal -->)',
              '',
              html,
              count=1,
          )

          # Ensure the standalone controller is loaded directly from the page,
          # never via Apache HTML rewriting.
          tag = '<script defer src="theme-settings.js?v=2.1.0"></script>'
          if tag not in html:
              html = html.replace('</head>', tag + '\n</head>', 1)

          # Sanity check: exactly one template-level theme toggle remains.
          count = len(re.findall(r'@click="toggleTheme\(\)"', html))
          if count != 1:
              raise SystemExit(f'Expected exactly one theme toggle, found {count}')

          path.write_text(html, encoding='utf-8')

      - name: Remove default founder image fallbacks
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('index.html'): (
                  '<img :src="data.site.founder?.image_url || \'assets/uploads/1786632160_7795.jpg\'" \n                                     @error="$el.src = \'assets/uploads/1786632160_7795.jpg\'"',
                  '<img x-show="data.site.founder?.image_url" :src="data.site.founder?.image_url"',
              ),
              Path('founder.html'): (
                  '<img :src="data.site.founder?.image_url || \'assets/uploads/1786632189_4076.jpg\'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">',
                  '<img x-show="data.site.founder?.image_url" :src="data.site.founder?.image_url" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">',
              ),
          }

          for path, (old, new) in replacements.items():
              html = path.read_text(encoding='utf-8')
              if old not in html:
                  raise SystemExit(f'Expected founder image fallback not found in {path}')
              path.write_text(html.replace(old, new, 1), encoding='utf-8')

      - name: Verify requested cleanup
        shell: python
        run: |
          from pathlib import Path
          admin = Path('admin/index.html').read_text(encoding='utf-8')
          home = Path('index.html').read_text(encoding='utf-8')
          founder = Path('founder.html').read_text(encoding='utf-8')

          if 'ডিফল্ট এডমিন লগইন তথ্য' in admin or '#Tarique-1998' in admin:
              raise SystemExit('Default admin credentials are still visible')
          if "1786632160_7795.jpg'" in home or "1786632189_4076.jpg'" in founder:
              raise SystemExit('Founder image fallback is still present')
          if 'theme-settings.js?v=2.1.0' not in admin:
              raise SystemExit('Standalone theme controller is not loaded')
          print('Requested cleanup verified')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html admin/.htaccess index.html founder.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Remove default credentials and founder image fallbacks"
          git push
