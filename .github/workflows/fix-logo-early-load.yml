name: Fix early logo loading

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add cached logo bootstrap
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = 'aspi-early-logo-bootstrap'
          if marker not in html:
              block = '''\n<script id="aspi-early-logo-bootstrap">\n(function(){\n  try {\n    var cached = localStorage.getItem('aspi_site_logo');\n    if (cached) {\n      var pre = document.createElement('link');\n      pre.rel = 'preload';\n      pre.as = 'image';\n      pre.href = cached;\n      document.head.appendChild(pre);\n      document.documentElement.dataset.aspiLogo = cached;\n    }\n  } catch(e) {}\n})();\n</script>\n'''
              html = html.replace('</head>', block + '</head>', 1)

          # Make favicon prefer cached logo immediately, otherwise leave the
          # admin-managed path in place until application data is loaded.
          html = re.sub(
              r'<link id="siteFavicon"[^>]*>',
              '<link id="siteFavicon" rel="icon" type="image/png" href="assets/uploads/1787121756078_5353.png">',
              html,
              count=1,
              flags=re.I,
          )

          # For the intro logo, use cached path before Alpine data is available.
          old = ':src="data.site.logo || \'assets/uploads/1787121756078_5353.png\'"'
          new = ':src="data.site.logo || document.documentElement.dataset.aspiLogo || \'assets/uploads/1787121756078_5353.png\'"'
          html = html.replace(old, new, 1)

          # Cache the latest successful logo whenever site data becomes available.
          cache_marker = 'aspi-logo-cache-update'
          if cache_marker not in html:
              cache_js = '''\n<script id="aspi-logo-cache-update">\nwindow.addEventListener('load', function(){\n  try {\n    if (window.Alpine) {\n      setTimeout(function(){\n        var root = document.querySelector('[x-data="frontendApp"]');\n        var app = root && window.Alpine.$data(root);\n        var logo = app && app.data && app.data.site && app.data.site.logo;\n        if (logo) localStorage.setItem('aspi_site_logo', logo);\n      }, 0);\n    }\n  } catch(e) {}\n});\n</script>\n'''
              html = html.replace('</body>', cache_js + '</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load site logo immediately from cache"
          git push
