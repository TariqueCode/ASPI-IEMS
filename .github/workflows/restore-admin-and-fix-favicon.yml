name: Restore admin dashboard and fix favicon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good admin dashboard
        shell: bash
        run: |
          git checkout f3161ce447968a7544373feef4c39b0e2b207b40 -- admin/index.html

      - name: Add instant non-blocking favicon
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<link id="adminFavicon" rel="icon" type="image/png" href="">'
          new = '''<link id="adminFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'%3E%3Crect width=\'64\' height=\'64\' rx=\'14\' fill=\'%230f172a\'/%3E%3Ccircle cx=\'32\' cy=\'32\' r=\'22\' fill=\'%23facc15\'/%3E%3Ctext x=\'32\' y=\'39\' text-anchor=\'middle\' font-family=\'Arial,sans-serif\' font-size=\'20\' font-weight=\'700\' fill=\'%230f172a\'%3EASPI%3C/text%3E%3C/svg%3E">'''
          if old not in s:
              raise SystemExit('Expected favicon line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html
          git commit -m "Restore admin dashboard and fix favicon"
          git push
