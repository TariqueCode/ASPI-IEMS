    <script>
        // Compatibility shim for iframe environments where window.fetch is a getter-only property
        (function() {
            try {
                let _nativeFetch = window.fetch ? window.fetch.bind(window) : null;
                Object.defineProperty(window, 'fetch', {
                    get: function() { return _nativeFetch; },
                    set: function(fn) { _nativeFetch = fn; },
                    configurable: true,
                    enumerable: true
                });
            } catch (e) {
                try {
                    let _nativeFetch = window.fetch;
                    Object.defineProperty(Window.prototype, 'fetch', {
                        get: function() { return _nativeFetch; },
                        set: function(fn) { _nativeFetch = fn; },
                        configurable: true,
                        enumerable: true
                    });
                } catch (e2) {}
            }
        })();
    </script>

    <script>
        // Synchronous immediate system / device dark mode detector (executes before HTML render to prevent flash)
        (function() {
            try {
                const savedTheme = localStorage.getItem('aspi_admin_theme');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                    document.documentElement.classList.add('dark');
                } else if (savedTheme === 'light') {
                    document.documentElement.classList.remove('dark');
                } else if (systemPrefersDark) {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {}
        })();
    </script>
